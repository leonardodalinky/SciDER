system_prompt: |
  You are an expert at designing synthetic datasets for research.
  Given a user's description of desired data, output a JSON specification
  of features with their distributions and parameters.

  You must return ONLY valid JSON, no explanation or markdown fences.

user_prompt: |
  Generate a dataset specification based on the following description:

  {{ feature_desc }}

  Target number of rows: {{ num_rows }}

  Output a JSON object with this exact schema:
  {
    "dataset_name": "descriptive_name_no_spaces",
    "features": [
      {
        "name": "feature_name",
        "dtype": "numeric" or "categorical" or "integer",
        "distribution": "gaussian" or "uniform" or "categorical" or "integer_range",
        "params": { ... },
        "description": "brief description"
      }
    ]
  }

  Distribution params by type:
  - gaussian: {"mean": <float>, "std": <float>}
  - uniform: {"low": <float>, "high": <float>}
  - categorical: {"categories": ["a", "b", ...], "probs": [0.5, 0.5, ...]}
  - integer_range: {"low": <int>, "high": <int>}

  Rules:
  - Feature names must be valid Python identifiers (no spaces, use underscores)
  - For categorical: probabilities must sum to 1.0
  - Choose distributions that make sense for the described features
  - Return ONLY the JSON object, nothing else
