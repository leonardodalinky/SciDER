# GPT Low-Medium cost model configuration
# For OpenAI models, "reasoning" is a dict (not "reasoning_effort" string)

models:
  ideation:
    model: gpt-5-mini
    key_source: openai
    reasoning:
      effort: low

  paper_search:
    model: gpt-5-nano
    key_source: openai
    reasoning:
      effort: low

  metric_search:
    model: gpt-5-nano
    key_source: openai
    reasoning:
      effort: low

  data:
    model: gpt-5-nano
    key_source: openai
    reasoning:
      effort: low
      summary: detailed

  critic:
    model: gpt-5-nano
    key_source: openai
    reasoning:
      effort: low

  history:
    model: gpt-5-nano
    key_source: openai
    reasoning:
      effort: minimal

  experiment:
    model: gpt-5-mini
    key_source: openai
    reasoning:
      effort: low

  experiment_coding:
    model: gpt-5-mini
    key_source: openai
    reasoning:
      effort: low

  embed:
    model: text-embedding-3-small
    key_source: openai
