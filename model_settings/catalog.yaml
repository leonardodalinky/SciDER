# Unified Model Catalog
#
# Single source of truth for all models SciDER knows about, regardless of
# provider. Each entry declares its provider, LiteLLM model id, what it can do
# (capabilities), which env vars are required, and any default LiteLLM kwargs.
#
# Add a new model: drop a new entry here, then optionally point a role at it
# via model_settings/role_defaults.yaml or via the frontend Settings page.

models:
  # ---- Gemini (completion) ----
  gemini-2.5-flash-lite:
    provider: gemini
    litellm_id: gemini/gemini-2.5-flash-lite
    capabilities: [completion]
    requires_env: [GEMINI_API_KEY]
    default_params:
      reasoning_effort: low

  gemini-2.5-flash:
