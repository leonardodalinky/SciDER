# Gemini Low-Medium cost model configuration
# key_source: which API key to use ("gemini" or "openai")
# Extra params (reasoning_effort, temperature, top_p) are passed to ModelRegistry.register()

models:
  ideation:
    model: gemini/gemini-2.5-flash
    key_source: gemini
    reasoning_effort: low

  paper_search:
    model: gemini/gemini-2.5-flash-lite
    key_source: gemini
    reasoning_effort: low

  metric_search:
    model: gemini/gemini-2.5-flash-lite
    key_source: gemini
    reasoning_effort: low

  data:
    model: gemini/gemini-2.5-flash-lite
    key_source: gemini
    reasoning_effort: low

  critic:
    model: gemini/gemini-2.5-flash-lite
    key_source: gemini
    reasoning_effort: low
    temperature: 0.3
    top_p: 0.9

  history:
    model: gemini/gemini-2.5-flash-lite
    key_source: gemini

  experiment:
    model: gemini/gemini-2.5-flash
    key_source: gemini
    reasoning_effort: low

  experiment_coding:
    model: gemini/gemini-2.5-flash
    key_source: gemini
    reasoning_effort: low
